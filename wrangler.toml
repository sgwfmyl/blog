name = "blog"
compatibility_date = "2026-10-13"
# 禁用「导航请求优先资产服务」：否则 SSR 页面（/archive/、/private/、/diary/ 等 prerender=false）
# 的浏览器导航请求（Sec-Fetch-Mode: navigate，即 F5 刷新/点击链接）会因静态资产未命中而
# 直接 404，不进入 Worker SSR 路由。加上此 flag 后导航请求在静态资产未命中时会回落到 Worker。
compatibility_flags = ["assets_navigation_has_no_effect"]

# @astrojs/cloudflare 适配器（v14，基于 @cloudflare/vite-plugin）会在构建时自动：
#   - 设置 worker 入口 main（dist/server/entry.mjs）
#   - 设置 assets.directory 指向 client 构建产物（dist/client），并补 binding = "ASSETS"
# 因此这里不再写 directory / binding，仅保留会透传到部署配置的项。
# 后续阶段新增 bindings（如 D1 / Durable Object / KV）时在此追加即可。
[assets]
not_found_handling = "404-page"

# D1：管理员会话强一致存储（阶段 3 引入，替代旧 HMAC 无状态 Cookie 方案）
# 亚太区域（apac），用户手动创建。
[[d1_databases]]
binding = "DB"
database_name = "blog"
database_id = "ab8cdde0-69b6-40d4-91de-ab1fd2f96a0b"
migrations_dir = "migrations"

# KV：GitHub 私有内容缓存（沿用旧方案的 ADMIN_KV 用途）
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "915eb0640df644678621ea2b77177061"

# KV：Astro sessions 自动启用所需的 SESSION binding（我们鉴权走 D1，此绑定仅占位，不落数据）
[[kv_namespaces]]
binding = "SESSION"
id = "e6f10d30a57d46ff815fe1c33c806e30"