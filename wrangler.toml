name = "blog"
compatibility_date = "2026-10-13"

# @astrojs/cloudflare 适配器（v14，基于 @cloudflare/vite-plugin）会在构建时自动：
#   - 设置 worker 入口 main（dist/server/entry.mjs）
#   - 设置 assets.directory 指向 client 构建产物（dist/client），并补 binding = "ASSETS"
# 因此这里不再写 directory / binding，仅保留会透传到部署配置的项。
# 后续阶段新增 bindings（如 D1 / Durable Object / KV）时在此追加即可。
[assets]
not_found_handling = "404-page"

# D1：管理员会话强一致存储（阶段 3 引入，替代旧 HMAC 无状态 Cookie 方案）
[[d1_databases]]
binding = "DB"
database_name = "blog"
database_id = "65326a47-7bca-417f-9e0b-a6010b23e99d"
migrations_dir = "migrations"

# KV：GitHub 私有内容缓存（沿用旧方案的 ADMIN_KV 用途）
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "915eb0640df644678621ea2b77177061"